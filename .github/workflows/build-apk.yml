name: Build Beyond Words APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar estructura
        run: |
          pwd
          ls -la
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Verificar Flutter
        run: |
          flutter --version
          dart --version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar plataforma Android sin sobrescribir
        run: |
          rm -rf /tmp/bw_android
          flutter create \
            --platforms=android \
            --org com.beyondword \
            --project-name beyond_words \
            /tmp/bw_android
          rm -rf android
          cp -R /tmp/bw_android/android ./android

      - name: Escribir AndroidManifest con permisos BLE
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />
              <uses-feature android:name="android.hardware.bluetooth_le"
                  android:required="true" />
              <application
                  android:label="Beyond Words"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Restaurar dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze || true

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Verificar APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Beyond-Words-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
